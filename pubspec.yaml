name: fitness_ai_ui
description: Fitness AI mobile client for iOS and Android. Supabase Auth plus FastAPI workout data.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.9.1
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  fl_chart: ^1.0.0
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  riverpod_annotation: ^2.6.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  freezed: ^3.1.0
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
